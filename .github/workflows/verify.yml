# Green CI reruns aggregate verifiers and the participant-data guard; it does not prove clinical truth or peer review.

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Pin R survey 4.5
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_version("survey", version="4.5", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages(c("haven","jsonlite"), repos="https://cloud.r-project.org")'
      - name: Fetch NHANES files and refit
        run: python3 pilot/fetch.py && python3 pilot/refit.py
      - name: make verify
        run: make verify
      - name: Working tree clean after verify
        run: git diff --exit-code -- results certificates commitment
