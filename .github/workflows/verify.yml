# Re-runs all result verifiers and the participant-data guard on pinned Python and R survey 4.5.
# Green CI shows committed certificates are reproducible; it is not peer review or clinical validation.

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_CORETYPE: Haswell
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: commitment pin checksums
        run: sha256sum --strict -c commitment/SHA256SUMS
      - name: CPU and BLAS configuration
        run: |
          lscpu
          python -c "import numpy; numpy.show_config()"
      # Pilot verify before setup-r (PR #9 reorder); run 41746542087 drift cause CONJECTURE.
      - name: make verify-pilot-2026-10-31
        run: make verify-pilot-2026-10-31
      - name: Pilot fits perturbation regression tests
        run: pytest -q tests/test_pilot_fits_verify.py
      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
      - name: Pin R survey 4.5
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cloud.r-project.org")'
          Rscript -e 'remotes::install_version("survey", version="4.5", repos="https://cloud.r-project.org")'
          Rscript -e 'install.packages(c("haven","jsonlite"), repos="https://cloud.r-project.org")'
      - name: make verify (outcomes, cause-specific, guard)
        run: make verify-outcomes-2026-10-31 verify-cause-specific-mortality participant-guard
      - name: Working tree clean after verify
        run: git diff --exit-code -- results certificates commitment
