name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The pilot scripts compile
        run: python -m py_compile pilot/*.py
      - name: No per-participant data is committed
        run: |
          if git ls-files | grep -iE '(^data/|\.xpt$|fits\.csv$)'; then
            echo "Per-participant data must not be committed (see the policy in README.md)."
            exit 1
          fi
          if git grep -nE '\bSEQN[,= :]+[0-9]{4,}'; then
            echo "Respondent numbers found. Commit aggregate results only."
            exit 1
          fi
